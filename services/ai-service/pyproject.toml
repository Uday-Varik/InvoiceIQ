[project]
name = "invoiceiq-ai-service"
version = "0.1.0"
description = "InvoiceIQ extraction and advisory risk signals (no payment authority)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "invoiceiq-contracts",
  "pydantic==2.13.5",
  "pypdf==6.19.0",
  "uvicorn==0.54.0",
]

[tool.uv.sources]
invoiceiq-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]

# Architecture rules. tests/test_architecture.py proves each contract fires.
[tool.importlinter]
root_package = "ai_service"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "no-money-db"
name = "ai-service has no database drivers or ORMs (it cannot touch a money table)"
type = "forbidden"
source_modules = ["ai_service"]
forbidden_modules = ["sqlalchemy", "psycopg", "psycopg2", "asyncpg", "sqlite3", "pg8000", "databases", "sqlmodel"]

[[tool.importlinter.contracts]]
id = "layers"
name = "api -> domain (extraction, signals) -> documents -> providers"
type = "layers"
layers = [
  "ai_service.api",
  "ai_service.extraction | ai_service.signals",
  "ai_service.documents",
  "ai_service.providers",
]
