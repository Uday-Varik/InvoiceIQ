[project]
name = "invoiceiq-data"
version = "0.1.0"
description = "Synthetic data, labels, red-team taxonomy and frozen eval sets for InvoiceIQ"
requires-python = ">=3.11"
dependencies = [
  "invoiceiq-contracts",
  "pydantic==2.13.5",
  "pyyaml==6.0.3",
]

[project.scripts]
invoiceiq-data = "invoiceiq_data.cli:main"

[tool.uv.sources]
invoiceiq-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoiceiq_data"]
