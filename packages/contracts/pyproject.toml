[project]
name = "invoiceiq-contracts"
version = "0.1.0"
description = "Pydantic models generated from packages/contracts/openapi"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.5"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generated/python/invoiceiq_contracts"]
