    PaymentRunStatus:
      type: string
      enum: [queued, paid, cancelled]
    PaymentRunItem:
      type: object
      additionalProperties: false
      required: [invoiceId, vendorId, vendorName, accountLast4, amount, invoiceNumber, dueDate, state]
      properties:
        invoiceId:
          type: string
          format: uuid
        vendorId:
          type: string
          format: uuid
        vendorName:
          type: string
        accountLast4:
          type:
            - string
            - 'null'
        amount:
          $ref: '#/components/schemas/Money'
        invoiceNumber:
          type:
            - string
            - 'null'
        dueDate:
          type:
            - string
            - 'null'
          format: date
        state:
          $ref: '#/components/schemas/InvoiceState'
    PaymentRun:
      type: object
      additionalProperties: false
      required: [id, currency, status, invoiceCount, total, version, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        status:
          $ref: '#/components/schemas/PaymentRunStatus'
        invoiceCount:
          type: integer
          minimum: 1
        total:
          $ref: '#/components/schemas/Money'
        version:
          type: integer
          minimum: 1
        comment:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        closedBy:
          type: string
        closedAt:
          type: string
          format: date-time
        closeComment:
          type: string
        items:
          type: array
          description: Present on getPaymentRun and on create, confirm and cancel responses.
          items:
            $ref: '#/components/schemas/PaymentRunItem'
    PaymentRunList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRun'
    PaymentRunRequest:
      type: object
      additionalProperties: false
      required: [currency]
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        invoiceIds:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid
        comment:
          type: string
          maxLength: 2000
    PaymentRunResult:
      type: object
      additionalProperties: false
      required: [run, held, skipped]
      properties:
        run:
          oneOf:
            - $ref: '#/components/schemas/PaymentRun'
            - type: 'null'
        held:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [invoiceId, reason]
            properties:
              invoiceId:
                type: string
                format: uuid
              reason:
                $ref: '#/components/schemas/ReasonCode'
        skipped:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [invoiceId, why]
            properties:
              invoiceId:
                type: string
                format: uuid
              why:
                type: string
                enum: [CURRENCY_MISMATCH, TOTAL_UNKNOWN, VENDOR_UNKNOWN]
    PaymentRunClose:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        comment:
          type: string
          maxLength: 2000
    PaymentRunCancel:
      type: object
      additionalProperties: false
      required: [expectedVersion, comment]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        comment:
          type: string
          minLength: 1
          maxLength: 2000
    AuditCheckpoint:
      type: object
      description: |
        An Ed25519-signed statement that entry `seq` of the tenant's chain has
        hash `hash`. `statement` is the canonical JSON of v, tenantId, seq,
        hash, createdAt and keyId: exactly the signed bytes.
      required: [v, tenantId, seq, hash, createdAt, keyId, statement, signature, publicKey]
      properties:
        v:
          type: integer
          const: 1
        tenantId:
          type: string
          format: uuid
        seq:
          type: integer
          minimum: 0
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        createdAt:
          type: string
          format: date-time
        keyId:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: First 16 hex digits of SHA-256 over the DER public key.
        statement:
          type: string
          maxLength: 1000
        signature:
          type: string
          maxLength: 200
          description: Base64 Ed25519 signature over `statement` (UTF-8).
        publicKey:
          type: string
          maxLength: 200
          description: Base64 DER (SPKI) Ed25519 public key.
        createdBy:
          type: string
    AuditCheckpointList:
      type: object
      additionalProperties: false
      required: [currentKeyId, currentPublicKey, items]
      properties:
        currentKeyId:
          type: string
          pattern: '^[0-9a-f]{16}$'
        currentPublicKey:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditCheckpoint'
    AuditCheckpointVerification:
      type: object
      additionalProperties: false
      required: [ok, trustedKey]
      properties:
        ok:
          type: boolean
        trustedKey:
          type: boolean
          description: Signed by this deployment's key, or a key this tenant has used before. Compare keyId with the one you pinned.
        seq:
          type: integer
          minimum: 0
        reason:
          type: string
