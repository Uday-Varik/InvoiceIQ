      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
    VendorUpdate:
      type: object
      additionalProperties: false
      required: [expectedVersion, status]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, inactive]
        comment:
          type: string
          maxLength: 2000
    BankChangeVerification:
      type: object
      additionalProperties: false
      required: [callbackNote]
      properties:
        callbackNote:
          type: string
