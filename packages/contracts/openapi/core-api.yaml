openapi: 3.1.0
info:
  title: InvoiceIQ core-api
  version: 0.1.0
  summary: System of record for invoices, approvals and the payment-safety control layer.
  description: |
    core-api owns every money-bearing table. It is the only service allowed to
    change invoice state, and every state change goes through the lifecycle gate
    (`evaluateTransition`). Operations tagged `x-phase: 0` to `x-phase: 3`
    are implemented; later phases are specified here first so contracts lead
    code.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: InvoiceIQ maintainers
    url: https://github.com/Uday-Varik/InvoiceIQ
servers:
  - url: /
    description: Same origin as the caller (local ports are in docker-compose.yml)
tags:
  - name: health
    description: Liveness and readiness
  - name: lifecycle
    description: Invoice lifecycle and reason catalog
  - name: invoices
    description: Invoice intake and review
  - name: vendors
    description: Vendor master and bank-detail changes
  - name: payments
    description: Payment runs
  - name: audit
    description: Hash-chained audit ledger and signed checkpoints
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags: [health]
      security: []
      x-phase: 0
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: >-
        200 when Postgres answers and every migration this build ships is
        applied, else 503. ai-service is reported but never makes core-api
        unready, because it scales to zero and the outbox absorbs its cold
        start. Failure details never include server messages.
      tags: [health]
      security: []
      x-phase: 4
      responses:
        '200':
          description: Ready for traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics
      description: >-
        Prometheus text exposition (version 0.0.4). Needs the scrape token when
        METRICS_TOKEN is set; in production without one it answers 404. Labels
        never carry tenant, user, vendor or invoice ids.
      tags: [health]
      security:
        - metricsToken: []
      x-phase: 4
      responses:
        '200':
          description: Current metrics
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/lifecycle/states:
    get:
      operationId: listLifecycleStates
      summary: List lifecycle states and their allowed next states
      tags: [lifecycle]
      x-phase: 0
      responses:
        '200':
          description: The lifecycle graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleStates'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/reason-codes:
    get:
      operationId: listReasonCodes
      summary: List the reason catalog
      tags: [lifecycle]
      x-phase: 0
      responses:
        '200':
          description: All reason codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReasonCodeList'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/lifecycle/evaluate:
    post:
      operationId: evaluateTransition
      summary: Dry-run a lifecycle transition against the safety gate
      tags: [lifecycle]
      x-phase: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: Whether the transition would be allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionEvaluation'
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/invoices:
    get:
      operationId: listInvoices
      summary: List invoices for the caller's tenant
      tags: [invoices]
      x-phase: 1
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/InvoiceState'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/CurrencyFilter'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/MinTotalMinor'
        - $ref: '#/components/parameters/MaxTotalMinor'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: A page of invoices, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePage'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createInvoice
      summary: Upload an invoice document
      description: |
        Stores the document, creates the invoice in RECEIVED and queues extraction
        through the outbox in the same transaction. Uploading the same bytes twice
        for one tenant is refused with 409; retrying with the same Idempotency-Key
        returns the original response.
      tags: [invoices]
      x-phase: 1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvoiceUpload'
      responses:
        '201':
          description: Invoice created in RECEIVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
  /v1/invoices/summary:
    get:
      operationId: getInvoiceSummary
      summary: Counts per state and totals per currency for the dashboard
      description: |
        Takes the same filters as listInvoices. Totals are summed per currency
        and never converted.
      tags: [invoices]
      x-phase: 2
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/InvoiceState'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/CurrencyFilter'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/MinTotalMinor'
        - $ref: '#/components/parameters/MaxTotalMinor'
      responses:
        '200':
          description: The summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/invoices/export:
    get:
      operationId: exportInvoices
      summary: Export invoices as CSV or JSON
      description: |
        Takes the same filters as listInvoices and returns every match, newest
        first, up to `limit` rows. `X-Export-Truncated: true` says more rows
        matched than were returned. CSV cells that a spreadsheet would read as
        a formula are prefixed with a single quote.
      tags: [invoices]
      x-phase: 2
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, json]
            default: csv
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/InvoiceState'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/CurrencyFilter'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/MinTotalMinor'
        - $ref: '#/components/parameters/MaxTotalMinor'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 5000
      responses:
        '200':
          description: The matching invoices
          headers:
            X-Export-Truncated:
              schema:
                type: string
                enum: ['true', 'false']
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceExport'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/invoices/{invoiceId}:
    get:
      operationId: getInvoice
      summary: Get one invoice
      tags: [invoices]
      x-phase: 1
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: The invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: correctInvoice
      summary: Correct extracted fields before approval
      description: |
        Human-only. Allowed while the invoice is PENDING_APPROVAL, HOLD or
        EXCEPTION. `expectedVersion` must equal the invoice's current version,
        so a reviewer never overwrites a change they have not seen. Only the
        fields present in the body change; `null` clears an optional field.
        The correction is recorded in the audit ledger with before and after
        values, then the invoice goes back through deterministic validation
        and policy routing, so a corrected total gets the approval tier and
        review rules of the new amount. AI signals are not re-run on
        human-entered values.
      tags: [invoices]
      x-phase: 2
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCorrection'
      responses:
        '200':
          description: The corrected invoice in the state validation routed it to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/invoices/{invoiceId}/document:
    get:
      operationId: getInvoiceDocument
      summary: Download the original invoice document
      tags: [invoices]
      x-phase: 1
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: The document bytes, with the content type it was uploaded with
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/invoices/{invoiceId}/approve:
    post:
      operationId: approveInvoice
      summary: Approve an invoice that is PENDING_APPROVAL
      description: |
        Human-only (enforced by the lifecycle gate). The caller's role must cover
        the approval tier for the invoice total in the tenant policy, and the
        caller must not have uploaded or corrected the invoice. A tier that needs
        N approvals needs N different people: until the last one, the approval
        is recorded and the invoice stays PENDING_APPROVAL (see `approvals` and
        `approvalTier`). Any state change or correction resets the count.
      tags: [invoices]
      x-phase: 1
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceApproval'
      responses:
        '200':
          description: Approval recorded; the invoice is APPROVED once the tier has all it needs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/invoices/{invoiceId}/reject:
    post:
      operationId: rejectInvoice
      summary: Reject an invoice with at least one reason that allows REJECTED
      tags: [invoices]
      x-phase: 1
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceRejection'
      responses:
        '200':
          description: Invoice is REJECTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/invoices/{invoiceId}/transitions:
    post:
      operationId: transitionInvoice
      summary: Move an invoice to a new state through the safety gate
      tags: [invoices]
      x-phase: 1
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceTransition'
      responses:
        '200':
          description: Transition applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/vendors:
    get:
      operationId: listVendors
      summary: List vendors by name, with whether each can be paid now
      tags: [vendors]
      x-phase: 3
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive substring of the vendor name.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Vendors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorList'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createVendor
      summary: Register a vendor (invoices also register theirs on first sight)
      tags: [vendors]
      x-phase: 3
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorCreate'
      responses:
        '201':
          description: Vendor registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/vendors/{vendorId}:
    get:
      operationId: getVendor
      summary: A vendor with its bank-change history
      tags: [vendors]
      x-phase: 3
      parameters:
        - $ref: '#/components/parameters/VendorId'
      responses:
        '200':
          description: The vendor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateVendor
      summary: Activate or deactivate a vendor (ap_manager or above)
      tags: [vendors]
      x-phase: 3
      parameters:
        - $ref: '#/components/parameters/VendorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorUpdate'
      responses:
        '200':
          description: Vendor updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/vendors/{vendorId}/bank-changes:
    post:
      operationId: requestVendorBankChange
      summary: Record a vendor bank-detail change (starts quarantine)
      description: |
        Needs role ap_clerk or above. Payments to the vendor stop at once and
        stay stopped until a different person verifies the change by callback
        AND the policy's quarantine window has passed.
      tags: [vendors]
      x-phase: 3
      parameters:
        - $ref: '#/components/parameters/VendorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankChangeRequest'
      responses:
        '202':
          description: Change recorded and quarantined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankChangeStatus'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/vendors/{vendorId}/bank-changes/{changeId}/verify:
    post:
      operationId: verifyVendorBankChange
      summary: Record the out-of-band callback that verifies a bank change
      description: |
        Needs role ap_manager or above, and a different person than the one who
        recorded the change. Only the vendor's latest change can be verified.
        Payments stay blocked until the quarantine window has also passed.
      tags: [vendors]
      x-phase: 3
      parameters:
        - $ref: '#/components/parameters/VendorId'
        - name: changeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankChangeVerification'
      responses:
        '200':
          description: Change verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankChangeStatus'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/payment-runs:
    get:
      operationId: listPaymentRuns
      summary: List payment runs, newest first
      tags: [payments]
      x-phase: 3
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PaymentRunStatus'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Payment runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRunList'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createPaymentRun
      summary: Assemble a payment run from APPROVED invoices in one currency
      description: |
        Needs role ap_manager or above. Queues every APPROVED invoice in the
        currency (or only `invoiceIds`), oldest due first, up to 500. Invoices
        whose vendor is inactive or in bank-change quarantine are moved to HOLD
        instead. Returns 201 with the run, or 200 with `run: null` when nothing
        could be queued.
      tags: [payments]
      x-phase: 3
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRunRequest'
      responses:
        '200':
          description: Nothing was payable; any holds are listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRunResult'
        '201':
          description: Run assembled; invoices are PAYMENT_QUEUED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRunResult'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/payment-runs/{runId}:
    get:
      operationId: getPaymentRun
      summary: A payment run with the invoices it pays
      tags: [payments]
      x-phase: 3
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRun'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/payment-runs/{runId}/file:
    get:
      operationId: getPaymentFile
      summary: The run's payment file (CSV), from the snapshot taken at assembly
      tags: [payments]
      x-phase: 3
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: CSV with a UTF-8 BOM and CRLF line ends
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/payment-runs/{runId}/confirm:
    post:
      operationId: confirmPaymentRun
      summary: Record that the run was paid; its invoices become PAID
      description: |
        Needs role controller or above, and a different person than the one who
        assembled the run. Refused if an invoice left the run, a vendor became
        blocked, or a vendor's bank details changed since assembly.
      tags: [payments]
      x-phase: 3
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRunClose'
      responses:
        '200':
          description: Run is paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRun'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/payment-runs/{runId}/cancel:
    post:
      operationId: cancelPaymentRun
      summary: Cancel a queued run; its invoices go to HOLD and need a fresh approval
      tags: [payments]
      x-phase: 3
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRunCancel'
      responses:
        '200':
          description: Run is cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRun'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/audit/verify:
    get:
      operationId: verifyAuditChain
      summary: Verify the tenant's audit hash chain
      tags: [audit]
      x-phase: 1
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerification'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/audit/checkpoints:
    get:
      operationId: listAuditCheckpoints
      summary: Signed checkpoints of the audit chain, newest first, plus the current signing key
      tags: [audit]
      x-phase: 3
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Checkpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditCheckpointList'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createAuditCheckpoint
      summary: Sign the current chain head (idempotent per head)
      description: |
        Needs role ap_manager or above. Refused when the chain is empty or does
        not verify. Returns the existing checkpoint (200) when the head is
        already signed. Publish the result somewhere the database owner cannot
        edit; that copy is what detects a later rewrite.
      tags: [audit]
      x-phase: 3
      responses:
        '200':
          description: The head was already signed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditCheckpoint'
        '201':
          description: New checkpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditCheckpoint'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/audit/checkpoints/verify:
    post:
      operationId: verifyAuditCheckpoint
      summary: Check a checkpoint kept outside the system against the current chain
      tags: [audit]
      x-phase: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditCheckpoint'
      responses:
        '200':
          description: Result; ok is false when the signature fails or the chain no longer matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditCheckpointVerification'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/me:
    get:
      operationId: getMe
      summary: The caller as core-api sees them (and, in demo mode, the personas to act as)
      tags: [health]
      x-phase: 3
      responses:
        '200':
          description: The caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    metricsToken:
      type: http
      scheme: bearer
      description: The METRICS_TOKEN value; only /metrics accepts it.
  parameters:
    Search:
      name: q
      in: query
      required: false
      description: Case-insensitive substring of the vendor name, invoice number or file name.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    CurrencyFilter:
      name: currency
      in: query
      required: false
      schema:
        type: string
        pattern: '^[A-Z]{3}$'
    DateFrom:
      name: dateFrom
      in: query
      required: false
      description: Invoice date on or after this day.
      schema:
        type: string
        format: date
    DateTo:
      name: dateTo
      in: query
      required: false
      description: Invoice date on or before this day.
      schema:
        type: string
        format: date
    MinTotalMinor:
      name: minTotalMinor
      in: query
      required: false
      description: Total at least this many minor units.
      schema:
        type: string
        pattern: '^-?[0-9]{1,18}$'
    MaxTotalMinor:
      name: maxTotalMinor
      in: query
      required: false
      description: Total at most this many minor units.
      schema:
        type: string
        pattern: '^-?[0-9]{1,18}$'
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VendorId:
      name: vendorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties: false
          required: [database, migrations, aiService]
          properties:
            database:
              $ref: '#/components/schemas/ReadinessCheck'
            migrations:
              allOf:
                - $ref: '#/components/schemas/ReadinessCheck'
              type: object
              required: [expected]
              properties:
                applied:
                  type: integer
                  minimum: 0
                expected:
                  type: integer
                  minimum: 0
            aiService:
              allOf:
                - $ref: '#/components/schemas/ReadinessCheck'
              type: object
              required: [required]
              properties:
                required:
                  type: boolean
                  const: false
    ReadinessCheck:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        latencyMs:
          type: integer
          minimum: 0
        detail:
          type: string
          maxLength: 200
    Health:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        code:
          type: string
          description: Machine-readable cause, e.g. a TransitionError such as HUMAN_REQUIRED.
    InvoiceState:
      type: string
      description: The 14-state invoice lifecycle.
      enum:
        - RECEIVED
        - EXTRACTING
        - EXTRACTED
        - VALIDATING
        - VALIDATED
        - MATCHING
        - MATCHED
        - PENDING_APPROVAL
        - APPROVED
        - REJECTED
        - HOLD
        - EXCEPTION
        - PAYMENT_QUEUED
        - PAID
    ReasonCode:
      type: string
      description: The 18-code reason catalog. Codes prefixed AI_ are AI-derived and HOLD-only.
      enum:
        - MATCH_PRICE_VARIANCE
        - MATCH_QUANTITY_VARIANCE
        - MATCH_PO_NOT_FOUND
        - MATCH_RECEIPT_MISSING
        - DUPLICATE_EXACT
        - DUPLICATE_NEAR
        - VENDOR_BANK_CHANGE_QUARANTINE
        - VENDOR_UNKNOWN
        - VENDOR_INACTIVE
        - VALIDATION_MISSING_FIELD
        - VALIDATION_TOTALS_MISMATCH
        - VALIDATION_CURRENCY_UNSUPPORTED
        - APPROVAL_LIMIT_EXCEEDED
        - POLICY_MANUAL_REVIEW_REQUIRED
        - AI_EXTRACTION_LOW_CONFIDENCE
        - AI_ANOMALY_SUSPECTED
        - AI_DOCUMENT_TAMPERING_SUSPECTED
        - AI_SEMANTIC_DUPLICATE_SUSPECTED
    ReasonSource:
      type: string
      enum: [deterministic, ai]
    ReasonOutcome:
      type: string
      enum: [HOLD, EXCEPTION, REJECTED]
    Severity:
      type: string
      enum: [low, medium, high, critical]
    ActorKind:
      type: string
      enum: [system, human, ai]
    Actor:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind:
          $ref: '#/components/schemas/ActorKind'
        id:
          type: string
          minLength: 1
    ReasonCodeDefinition:
      type: object
      additionalProperties: false
      required: [code, source, severity, allowedOutcomes, description]
      properties:
        code:
          $ref: '#/components/schemas/ReasonCode'
        source:
          $ref: '#/components/schemas/ReasonSource'
        severity:
          $ref: '#/components/schemas/Severity'
        allowedOutcomes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReasonOutcome'
        description:
          type: string
    ReasonCodeList:
      type: object
      additionalProperties: false
      required: [reasonCodes]
      properties:
        reasonCodes:
          type: array
          items:
            $ref: '#/components/schemas/ReasonCodeDefinition'
    LifecycleState:
      type: object
      additionalProperties: false
      required: [state, next]
      properties:
        state:
          $ref: '#/components/schemas/InvoiceState'
        next:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceState'
    LifecycleStates:
      type: object
      additionalProperties: false
      required: [states]
      properties:
        states:
          type: array
          items:
            $ref: '#/components/schemas/LifecycleState'
    TransitionRequest:
      type: object
      additionalProperties: false
      required: [from, to, actor]
      properties:
        from:
          $ref: '#/components/schemas/InvoiceState'
        to:
          $ref: '#/components/schemas/InvoiceState'
        actor:
          $ref: '#/components/schemas/Actor'
        reasons:
          type: array
          maxItems: 18
          items:
            $ref: '#/components/schemas/ReasonCode'
    TransitionError:
      type: string
      enum:
        - TERMINAL_STATE
        - EDGE_NOT_ALLOWED
        - AI_MAY_ONLY_HOLD
        - AI_REASON_OUTSIDE_HOLD
        - HUMAN_REQUIRED
        - REASON_REQUIRED
        - REASON_OUTCOME_MISMATCH
    TransitionEvaluation:
      type: object
      additionalProperties: false
      required: [allowed, from, to]
      properties:
        allowed:
          type: boolean
        from:
          $ref: '#/components/schemas/InvoiceState'
        to:
          $ref: '#/components/schemas/InvoiceState'
        error:
          $ref: '#/components/schemas/TransitionError'
        message:
          type: string
    Money:
      type: object
      description: Integer minor units of the currency (ISO 4217 exponent, so cents for USD, yen for JPY, fils for BHD) as a decimal string, never a float, plus the ISO 4217 currency.
      additionalProperties: false
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: string
          pattern: '^-?[0-9]{1,19}$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    InvoiceUpload:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: PDF, PNG or JPEG, at most 10 MiB. The type is sniffed from the bytes, not trusted from the client.
        sourceChannel:
          type: string
          enum: [upload, email, api]
          default: upload
    InvoiceDocument:
      type: object
      additionalProperties: false
      required: [sha256, contentType, filename, sizeBytes]
      properties:
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        contentType:
          type: string
          enum: [application/pdf, image/png, image/jpeg]
        filename:
          type: string
          maxLength: 255
        sizeBytes:
          type: integer
          minimum: 1
    ExtractedField:
      type: object
      additionalProperties: false
      required: [value, confidence]
      properties:
        value:
          type:
            - string
            - 'null'
        confidence:
          type: number
          minimum: 0
          maximum: 1
    InvoiceExtraction:
      type: object
      additionalProperties: false
      required: [provider, fields, extractedAt]
      properties:
        provider:
          type: string
        extractedAt:
          type: string
          format: date-time
        fields:
          type: object
          additionalProperties: false
          required: [vendorName, invoiceNumber, invoiceDate, currency, totalMinor]
          properties:
            vendorName:
              $ref: '#/components/schemas/ExtractedField'
            invoiceNumber:
              $ref: '#/components/schemas/ExtractedField'
            invoiceDate:
              $ref: '#/components/schemas/ExtractedField'
            currency:
              $ref: '#/components/schemas/ExtractedField'
            totalMinor:
              $ref: '#/components/schemas/ExtractedField'
            subtotalMinor:
              $ref: '#/components/schemas/ExtractedField'
            taxMinor:
              $ref: '#/components/schemas/ExtractedField'
            dueDate:
              $ref: '#/components/schemas/ExtractedField'
        lineItems:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ExtractedLineItem'
    ExtractedLineItem:
      type: object
      additionalProperties: false
      required: [description, quantity, unitPriceMinor, amountMinor, confidence]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 500
        quantity:
          type:
            - string
            - 'null'
        unitPriceMinor:
          type:
            - string
            - 'null'
        amountMinor:
          type:
            - string
            - 'null'
        confidence:
          type: number
          minimum: 0
          maximum: 1
    LineItem:
      type: object
      additionalProperties: false
      required: [position, description]
      description: A line of the invoice as stored (extracted, or entered by a reviewer). Amounts are in the invoice currency.
      properties:
        position:
          type: integer
          minimum: 1
        description:
          type: string
          minLength: 1
          maxLength: 500
        quantity:
          type: string
          pattern: '^[0-9]{1,12}(\.[0-9]{1,4})?$'
        unitPriceMinor:
          type: string
          pattern: '^-?[0-9]{1,18}$'
        amountMinor:
          type: string
          pattern: '^-?[0-9]{1,18}$'
    LineItemInput:
      type: object
      additionalProperties: false
      required: [description]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 500
        quantity:
          type: string
          pattern: '^[0-9]{1,12}(\.[0-9]{1,4})?$'
        unitPriceMinor:
          type: string
          pattern: '^-?[0-9]{1,18}$'
        amountMinor:
          type: string
          pattern: '^-?[0-9]{1,18}$'
    CorrectableField:
      type: string
      enum: [vendorName, invoiceNumber, invoiceDate, dueDate, currency, total, subtotal, tax, lineItems]
    FieldChange:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: {}
        to: {}
    InvoiceCorrection:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      minProperties: 2
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        vendorName:
          type: string
          minLength: 1
          maxLength: 256
        invoiceNumber:
          type: string
          minLength: 1
          maxLength: 64
        invoiceDate:
          type: string
          format: date
        dueDate:
          type:
            - string
            - 'null'
          format: date
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        totalMinor:
          type: string
          pattern: '^-?[0-9]{1,18}$'
        subtotalMinor:
          type:
            - string
            - 'null'
          pattern: '^-?[0-9]{1,18}$'
        taxMinor:
          type:
            - string
            - 'null'
          pattern: '^-?[0-9]{1,18}$'
        lineItems:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/LineItemInput'
        comment:
          type: string
          maxLength: 2000
    InvoiceEvent:
      type: object
      additionalProperties: false
      required: [seq, type, actor, occurredAt]
      properties:
        seq:
          type: integer
          minimum: 0
        type:
          type: string
        from:
          $ref: '#/components/schemas/InvoiceState'
        to:
          $ref: '#/components/schemas/InvoiceState'
        actor:
          $ref: '#/components/schemas/Actor'
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/ReasonCode'
        comment:
          type: string
        changes:
          type: object
          description: For invoice.corrected, each corrected field with its value before and after.
          propertyNames:
            $ref: '#/components/schemas/CorrectableField'
          additionalProperties:
            $ref: '#/components/schemas/FieldChange'
        occurredAt:
          type: string
          format: date-time
    Invoice:
      type: object
      additionalProperties: false
      required: [id, tenantId, state, reasons, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        vendorId:
          type: string
          format: uuid
        vendorName:
          type: string
          maxLength: 256
        invoiceNumber:
          type: string
          maxLength: 64
        invoiceDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        total:
          $ref: '#/components/schemas/Money'
        subtotal:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        lineItems:
          type: array
          description: Stored lines, in position order. Present on getInvoice and exportInvoices (JSON) only.
          items:
            $ref: '#/components/schemas/LineItem'
        corrections:
          type: array
          description: Fields a human has corrected since extraction.
          items:
            $ref: '#/components/schemas/CorrectableField'
        state:
          $ref: '#/components/schemas/InvoiceState'
        reasons:
          type: array
          description: Reasons for the transition into the current state. Empty unless the state is HOLD, EXCEPTION or REJECTED.
          items:
            $ref: '#/components/schemas/ReasonCode'
        version:
          type: integer
          minimum: 1
          description: Incremented on every state change and every correction.
        document:
          $ref: '#/components/schemas/InvoiceDocument'
        extraction:
          $ref: '#/components/schemas/InvoiceExtraction'
        paymentRunId:
          type: string
          format: uuid
          description: The payment run currently paying this invoice.
        approvals:
          type: array
          description: Every approval given, oldest first. Present on getInvoice and approveInvoice.
          items:
            $ref: '#/components/schemas/InvoiceApprovalRecord'
        approvalTier:
          $ref: '#/components/schemas/ApprovalTierStatus'
        history:
          type: array
          description: Audit entries for this invoice, oldest first. Present on getInvoice only.
          items:
            $ref: '#/components/schemas/InvoiceEvent'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InvoicePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        nextCursor:
          type: string
    StateCount:
      type: object
      additionalProperties: false
      required: [state, count]
      properties:
        state:
          $ref: '#/components/schemas/InvoiceState'
        count:
          type: integer
          minimum: 0
    CurrencyTotal:
      type: object
      additionalProperties: false
      required: [currency, count, amountMinor]
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        count:
          type: integer
          minimum: 0
        amountMinor:
          type: string
          pattern: '^-?[0-9]{1,24}$'
    InvoiceSummary:
      type: object
      additionalProperties: false
      required: [count, byState, byCurrency]
      properties:
        count:
          type: integer
          minimum: 0
        byState:
          type: array
          description: Every lifecycle state in lifecycle order, including zero counts.
          items:
            $ref: '#/components/schemas/StateCount'
        byCurrency:
          type: array
          description: Totals of invoices that have an extracted total, per currency, alphabetical.
          items:
            $ref: '#/components/schemas/CurrencyTotal'
    InvoiceExport:
      type: object
      additionalProperties: false
      required: [exportedAt, count, truncated, items]
      properties:
        exportedAt:
          type: string
          format: date-time
        count:
          type: integer
          minimum: 0
        truncated:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
    InvoiceTransition:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to:
          $ref: '#/components/schemas/InvoiceState'
        reasons:
          type: array
          maxItems: 18
          items:
            $ref: '#/components/schemas/ReasonCode'
        comment:
          type: string
          maxLength: 2000
    InvoiceApproval:
      type: object
      additionalProperties: false
      properties:
        comment:
          type: string
          maxLength: 2000
    InvoiceRejection:
      type: object
      additionalProperties: false
      required: [reasons]
      properties:
        reasons:
          type: array
          minItems: 1
          maxItems: 18
          items:
            $ref: '#/components/schemas/ReasonCode'
        comment:
          type: string
          maxLength: 2000
    BankChangeRequest:
      type: object
      additionalProperties: false
      required: [ibanOrAccountLast4, evidenceDocumentSha256]
      properties:
        ibanOrAccountLast4:
          type: string
          pattern: '^[0-9A-Z]{4}$'
        evidenceDocumentSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    BankChangeStatus:
      type: object
      additionalProperties: false
      required: [vendorId, changeId, accountLast4, quarantined, requestedBy, requestedAt, verifiedBy, verifiedAt]
      properties:
        vendorId:
          type: string
          format: uuid
        changeId:
          type: string
          format: uuid
        accountLast4:
          type: string
          pattern: '^[0-9A-Z]{4}$'
        quarantined:
          type: boolean
        releasesAt:
          type:
            - string
            - 'null'
          format: date-time
        why:
          type: string
          enum: [WINDOW_OPEN, UNVERIFIED, SELF_VERIFIED]
        requestedBy:
          type: string
        requestedAt:
          type: string
          format: date-time
        verifiedBy:
          type:
            - string
            - 'null'
        verifiedAt:
          type:
            - string
            - 'null'
          format: date-time
    AuditVerification:
      type: object
      additionalProperties: false
      required: [ok, entries]
      properties:
        ok:
          type: boolean
        entries:
          type: integer
          minimum: 0
        brokenAt:
          type: integer
          minimum: 0
        reason:
          type: string
        checkpointsChecked:
          type: integer
          minimum: 0
          description: Stored checkpoints compared with the chain. A mismatch makes ok false.
    ApproverRole:
      type: string
      description: Junior to senior; a role covers every role before it.
      enum: [ap_clerk, ap_manager, controller, cfo]
    InvoiceApprovalRecord:
      type: object
      additionalProperties: false
      required: [approverId, role, approvedAt, current]
      properties:
        approverId:
          type: string
        role:
          $ref: '#/components/schemas/ApproverRole'
        approvedAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Given at the invoice's current version, so it counts toward approval now.
        comment:
          type: string
          maxLength: 2000
    ApprovalTierStatus:
      type: object
      additionalProperties: false
      required: [name, role, required]
      properties:
        name:
          type: string
        role:
          $ref: '#/components/schemas/ApproverRole'
        required:
          type: integer
          minimum: 1
          maximum: 3
    Me:
      type: object
      additionalProperties: false
      required: [userId, tenantId, roles, authMode]
      properties:
        userId:
          type: string
        tenantId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            $ref: '#/components/schemas/ApproverRole'
        authMode:
          type: string
          enum: [demo, oidc]
        personas:
          type: array
          description: 'Demo mode only. Send `Authorization: Demo <id>` or the iq_demo_persona cookie to act as one.'
          items:
            type: object
            additionalProperties: false
            required: [id, roles]
            properties:
              id:
                type: string
              roles:
                type: array
                items:
