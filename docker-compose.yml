# Local stack: Postgres, ai-service and core-api, built from the same
# Dockerfiles as the hosted deploy. The web app runs outside Docker:
#   CORE_API_URL=http://localhost:3001 pnpm --filter @invoiceiq/web dev
#
#   docker compose up --build          # everything
#   docker compose up db               # just Postgres, for integration tests
#   ./scripts/smoke.sh                 # upload -> extract -> approve against the running stack
#
# Every secret here is a local-only placeholder.

name: invoiceiq

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: invoiceiq
      POSTGRES_PASSWORD: invoiceiq-local-only
      POSTGRES_DB: invoiceiq
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U invoiceiq -d invoiceiq']
      interval: 5s
      timeout: 3s
      retries: 20

  # No DATABASE_URL, on purpose (ADR-0007).
  ai-service:
    image: invoiceiq/ai-service:local
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    environment:
      AI_SIGNING_SECRET: local-only-signing-secret-do-not-deploy
      METRICS_TOKEN: local-only-metrics-token-do-not-deploy
    ports:
      - '8001:8001'

  core-api:
    image: invoiceiq/core-api:local
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    environment:
      DATABASE_URL: postgres://invoiceiq_app:invoiceiq-local-only-app-password@db:5432/invoiceiq
      MIGRATION_DATABASE_URL: postgres://invoiceiq:invoiceiq-local-only@db:5432/invoiceiq
      AUTH_MODE: demo
      AI_SERVICE_URL: http://ai-service:8001
      AI_SIGNING_SECRET: local-only-signing-secret-do-not-deploy
      METRICS_TOKEN: local-only-metrics-token-do-not-deploy
      # Exercise the boot-time app-role login step the hosted stack relies on.
      APP_DB_PASSWORD: invoiceiq-local-only-app-password
      # Nothing sits in front of core-api locally.
      TRUST_PROXY_HOPS: '0'
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started

volumes:
  db-data:
