name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (lint, types, OpenAPI, contracts, tests incl. Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # core-api integration tests run against this real Postgres; REQUIRE makes
      # a missing database a failure instead of a skip.
      TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/postgres
      REQUIRE_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make install-ts
      - run: make check-ts
      - name: Build web app
        run: pnpm --filter @invoiceiq/web run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  python:
    name: Python (lint, types, import rules, contracts, data, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - run: make install-py
      - run: make check-py

  infra:
    name: Infrastructure (Terraform validate, alert rules and dashboard queries)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TF_VERSION: 1.16.4
      # SHA256 of terraform_1.16.4_linux_amd64.zip from releases.hashicorp.com.
      TF_SHA256: dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df
      TF_IN_AUTOMATION: '1'
      PROM_VERSION: 3.7.0
      # SHA256 of prometheus-3.7.0.linux-amd64.tar.gz from its GitHub release (sha256sums.txt).
      PROM_SHA256: d54370c807d713fa73bc824ab128bde634ac9a80b37ad3d7768a6a9f63b63089
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Terraform (checksum-verified)
        run: |
          curl -fsSLo terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          echo "${TF_SHA256}  terraform.zip" | sha256sum --check --strict
          unzip -q terraform.zip terraform -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # No credentials and no backend: this never touches a real account.
      - run: terraform -chdir=infra/terraform fmt -check -recursive -diff
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
      - name: Install promtool (checksum-verified)
        run: |
          curl -fsSLo prometheus.tgz "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          echo "${PROM_SHA256}  prometheus.tgz" | sha256sum --check --strict
          tar -xzf prometheus.tgz --strip-components=1 -C "$RUNNER_TEMP/bin" "prometheus-${PROM_VERSION}.linux-amd64/promtool"
      - name: Check alert rules, their unit tests and dashboard queries
        run: infra/observability/check.sh

  docker:
    name: Docker images and end-to-end smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Build only: nothing is pushed anywhere.
      - name: Build core-api and ai-service images
        run: docker compose build
      - name: Start db, ai-service and core-api
        run: docker compose up --detach --wait --wait-timeout 180
      - name: Smoke test (upload, extract, approve, pay, checkpoint, metrics)
        run: ./scripts/smoke.sh http://localhost:3001
        env:
          SMOKE_METRICS_TOKEN: local-only-metrics-token-do-not-deploy
      - name: Service logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes
