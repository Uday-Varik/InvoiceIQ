name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (lint, types, OpenAPI, contracts, tests incl. Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # core-api integration tests run against this real Postgres; REQUIRE makes
      # a missing database a failure instead of a skip.
      TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/postgres
      REQUIRE_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make install-ts
      - run: make check-ts
      - name: Build web app
        run: pnpm --filter @invoiceiq/web run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  python:
    name: Python (lint, types, import rules, contracts, data, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - run: make install-py
      - run: make check-py

  docker:
    name: Docker images and end-to-end smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Build only: nothing is pushed anywhere.
      - name: Build core-api and ai-service images
        run: docker compose build
      - name: Start db, ai-service and core-api
        run: docker compose up --detach --wait --wait-timeout 180
      - name: Smoke test (upload, extract, approve, verify audit chain)
        run: ./scripts/smoke.sh http://localhost:3001
      - name: Service logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes
