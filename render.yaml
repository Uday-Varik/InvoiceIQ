# Render Blueprint for the two backends (free plan, scale to zero).
#
# W-UNV (Written-unverified): the sandbox that wrote this has no Render account,
# so this file has not been applied. The Dockerfiles it points at are built and
# run in CI. Setup steps: docs/runbooks/deploy-free-tier.md.

envVarGroups:
  - name: invoiceiq-shared
    envVars:
      # core-api signs every call to ai-service with this (HMAC-SHA256).
      - key: AI_SIGNING_SECRET
        generateValue: true
      # Bearer token Prometheus uses to scrape /metrics on both services.
      - key: METRICS_TOKEN
        generateValue: true

services:
  - type: web
    name: invoiceiq-ai-service
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/ai-service/Dockerfile
    dockerContext: .
    startCommand: /home/render/runner.sh
    healthCheckPath: /healthz
    autoDeploy: true
    buildFilter:
      paths:
        - services/ai-service/**
        - packages/contracts/generated/python/**
        - pyproject.toml
        - uv.lock
    envVars:
      - fromGroup: invoiceiq-shared
      # Deliberately no DATABASE_URL (ADR-0007).
      # OpenRouter API key for Qwen extraction.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: EXTRACTION_PROVIDER
        value: qwen
      # Optional: another OpenRouter model slug (default qwen/qwen3-235b-a22b).
      - key: OPENROUTER_MODEL
        sync: false

  - type: web
    name: invoiceiq-core-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/core-api/Dockerfile
    dockerContext: .
    startCommand: /home/render/runner.sh
    healthCheckPath: /healthz
    autoDeploy: true
    buildFilter:
      paths:
        - services/core-api/**
        - packages/contracts/**
        - package.json
        - pnpm-lock.yaml
    envVars:
      - fromGroup: invoiceiq-shared
      # Neon *pooled* URL for the invoiceiq_app role (RLS applies to it).
      - key: DATABASE_URL
        sync: false
      # Neon *direct* (unpooled) URL for the owner role. Migrations run on boot,
      # because the free plan has no pre-deploy command.
      - key: MIGRATION_DATABASE_URL
        sync: false
      # Ed25519 private key (PEM or base64 DER) that signs audit checkpoints.
      # Unset means a new key per boot, so old checkpoints stop verifying.
      - key: AUDIT_CHECKPOINT_KEY
        sync: false
      # Optional: with this set, boot gives invoiceiq_app LOGIN and this
      # password, replacing the hand-run ALTER ROLE step (24+ characters).
      - key: APP_DB_PASSWORD
        sync: false
      # github: GitHub OAuth login (needs GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET,
      # SESSION_SECRET). demo: no login, shared demo tenant. oidc: generic OIDC
      # (needs OIDC_ISSUER, OIDC_AUDIENCE, OIDC_JWKS_URL).
      - key: AUTH_MODE
        value: github
      # GitHub OAuth app credentials (required when AUTH_MODE=github).
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Signs session cookies (>= 32 chars, required when AUTH_MODE=github).
      - key: SESSION_SECRET
        generateValue: true
      # Frontend origin to redirect to after OAuth login.
      - key: FRONTEND_URL
        sync: false
      # Allowed CORS origins (comma-separated). Set to the Vercel frontend URL.
      - key: CORS_ORIGIN
        sync: false
      # https://invoiceiq-ai-service.onrender.com once that service exists.
      - key: AI_SERVICE_URL
        sync: false
      - key: NODE_ENV
        value: production
